<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Terminal - StockSight</title>
    <link rel="icon" type="image/jpeg" href="/static/img/brand/logo_dark.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="/static/js/firebase-config.js"></script>
    <style>
        body { overflow: hidden; height: 100vh; }
        .terminal-container { display: flex; height: 100vh; width: 100vw; background: var(--bg-color); }
        
        /* MarketWatch Sidebar */
        .market-watch { width: 380px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background: rgba(15, 23, 42, 0.4); }
        .mw-header { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .mw-search-box { position: relative; margin-bottom: 15px; }
        .mw-search-box input { width: 100%; padding: 10px 15px; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); color: white; font-size: 0.85rem; outline: none; }
        .mw-search-results { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid var(--border-color); border-radius: 6px; z-index: 100; max-height: 250px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .mw-tabs { display: flex; gap: 5px; overflow-x: auto; padding: 0 5px 10px; border-bottom: 1px solid var(--border-color); }
        .mw-tab { padding: 8px 12px; font-size: 0.75rem; color: var(--text-secondary); cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .mw-tab.active { background: rgba(59, 130, 246, 0.1); color: var(--accent-color); font-weight: 600; }
        
        .mw-list { flex: 1; overflow-y: auto; }
        .mw-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; position: relative; }
        .mw-row:hover { background: rgba(255,255,255,0.03); }
        .mw-row.active { background: rgba(59, 130, 246, 0.05); border-left: 3px solid var(--accent-color); }
        .mw-row-left h4 { font-size: 0.9rem; margin-bottom: 2px; }
        .mw-row-left p { font-size: 0.7rem; color: var(--text-secondary); }
        .mw-row-right { text-align: right; }
        .mw-row-price { font-size: 0.9rem; font-weight: 600; }
        .mw-row-change { font-size: 0.75rem; }
        
        .mw-row-actions { position: absolute; right: 0; top: 0; bottom: 0; width: 140px; background: inherit; display: none; align-items: center; justify-content: center; gap: 8px; padding-right: 10px; }
        .mw-row:hover .mw-row-actions { display: flex; }
        .mw-action-btn { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; background: rgba(255,255,255,0.05); }
        .mw-action-btn:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .mw-action-btn.delete:hover { background: var(--negative); border-color: var(--negative); }

        /* Detail View Main */
        .terminal-main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg-color); position: relative; }
        .main-header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .main-title-box h1 { font-size: 1.8rem; margin-bottom: 4px; }
        .main-price-box { display: flex; align-items: baseline; gap: 10px; }
        .main-price { font-size: 1.5rem; font-weight: 700; }
        
        .main-content { padding: 30px; display: flex; flex-direction: column; gap: 30px; }
        .chart-wrapper { height: 450px; width: 100%; position: relative; }
        
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .info-card { padding: 20px; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); }
        
        /* Floating Predict Box */
        .predict-overlay { position: absolute; right: 30px; top: 100px; width: 260px; z-index: 10; }
        
        .hidden { display: none !important; }
        .secondary-btn.back { padding: 6px 12px; font-size: 0.8rem; margin-right: 15px; }
    </style>
</head>
<body class="dark-theme">
    <div class="terminal-container hidden-onload" id="terminalContent">
        <!-- Sidebar -->
        <aside class="market-watch">
            <div class="mw-header">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;">
                    <div style="display:flex; align-items:center;">
                        <a href="/" class="secondary-btn back">←</a>
                        <h2 style="font-size:1.2rem; font-weight:700;">MarketWatch</h2>
                    </div>
                    <button id="deleteWatchlistBtn" class="secondary-btn hidden" title="Delete current list" style="padding:4px 8px; font-size:0.8rem; border-color:var(--negative); color:var(--negative);">🗑</button>
                </div>
                <div class="mw-search-box">
                    <input type="text" id="mwSearchInput" placeholder="Search & add (e.g. INFOSYS)..." autocomplete="off">
                    <div id="mwSearchResults" class="mw-search-results hidden"></div>
                </div>
                <div class="mw-tabs" id="mwTabs">
                    <!-- Tabs Injected -->
                </div>
            </div>
            <div class="mw-list" id="mwList">
                <!-- Rows Injected -->
            </div>
            <div style="padding:15px; border-top:1px solid var(--border-color);">
                <button id="createWatchlistBtn" class="secondary-btn" style="width:100%; font-size:0.8rem;">+ Create New List</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="terminal-main" id="terminalMain">
            <div id="noSelectionState" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-secondary);">
                <span style="font-size:4rem; margin-bottom:20px;">📈</span>
                <h3>Select a stock from MarketWatch to analyze</h3>
            </div>

            <div id="tickerDetails" class="hidden">
                <header class="main-header">
                    <div class="main-title-box">
                        <h1 id="mainTicker">--</h1>
                        <p id="mainName" style="color:var(--text-secondary); font-size:0.9rem;">--</p>
                    </div>
                    <div class="main-price-box">
                        <span class="main-price" id="mainPrice">₹0.00</span>
                        <span id="mainChange" style="font-weight:600;">-- (--%)</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <span id="navClock" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; border-right: 1px solid var(--border-color); padding-right: 20px; font-variant-numeric: tabular-nums;">--</span>
                        <button id="mainAddPortfolio" class="primary-btn" style="padding:10px 20px;">💼 Add Holdings</button>
                        <button id="themeToggleBtn" class="nav-btn theme-btn">🌙</button>
                    </div>
                </header>

                <div class="main-content">
                    <div class="chart-wrapper glass-panel">
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                            <div class="timeframe-selector" style="display:flex; gap:5px;">
                                <button class="tf-btn" data-period="1w">1W</button>
                                <button class="tf-btn" data-period="1m">1M</button>
                                <button class="tf-btn active" data-period="1y">1Y</button>
                                <button class="tf-btn" data-period="5y">5Y</button>
                            </div>
                            <div style="display:flex; gap:5px;">
                                <button class="ct-btn active" data-type="candlestick">Candle</button>
                                <button class="ct-btn" data-type="line">Line</button>
                            </div>
                        </div>
                        <canvas id="mainChartCanvas"></canvas>
                    </div>

                    <div class="info-grid">
                        <div class="info-card">
                            <h4 style="color:var(--text-secondary); font-size:0.8rem; margin-bottom:15px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Market Statistics</h4>
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                                <div style="display:flex; flex-direction:column;"><span style="font-size:0.7rem; color:var(--text-secondary);">Open</span><span id="statOpen" style="font-weight:600;">--</span></div>
                                <div style="display:flex; flex-direction:column;"><span style="font-size:0.7rem; color:var(--text-secondary);">Prev Close</span><span id="statPrevClose" style="font-weight:600;">--</span></div>
                                <div style="display:flex; flex-direction:column;"><span style="font-size:0.7rem; color:var(--text-secondary);">Day High</span><span id="statDayHigh" style="font-weight:600;">--</span></div>
                                <div style="display:flex; flex-direction:column;"><span style="font-size:0.7rem; color:var(--text-secondary);">Day Low</span><span id="statDayLow" style="font-weight:600;">--</span></div>
                                <div style="display:flex; flex-direction:column;"><span style="font-size:0.7rem; color:var(--text-secondary);">52W High</span><span id="statHigh52" style="font-weight:600;">--</span></div>
                                <div style="display:flex; flex-direction:column;"><span style="font-size:0.7rem; color:var(--text-secondary);">52W Low</span><span id="statLow52" style="font-weight:600;">--</span></div>
                                <div style="display:flex; flex-direction:column; grid-column: span 2;"><span style="font-size:0.7rem; color:var(--text-secondary);">Market Cap</span><span id="statCap" style="font-weight:600;">--</span></div>
                            </div>
                        </div>
                        <div class="info-card" style="background: rgba(59, 130, 246, 0.05); border-color: rgba(59, 130, 246, 0.2);">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <h4 style="color:var(--text-secondary); font-size:0.8rem;">AI Prediction</h4>
                                <select id="modelSelector" style="background:transparent; border:none; color:var(--accent-color); font-size:0.75rem; outline:none; cursor:pointer;">
                                    <option value="linear_regression">Linear</option>
                                    <option value="random_forest">Forest</option>
                                    <option value="xgboost">XGBoost</option>
                                </select>
                            </div>
                            <div id="predValue" style="font-size:1.5rem; font-weight:700; margin-bottom:5px;">--</div>
                            <div id="predMetrics" style="font-size:0.75rem; color:var(--text-secondary);">MAE: -- | R²: --</div>
                        </div>
                    </div>

                    <div class="news-section">
                        <h2 style="font-size:1.2rem; margin-bottom:20px;">Relevant Insights</h2>
                        <div id="newsGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px;">
                            <!-- News Injected -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals (Simplified versions) -->
    <div id="createWatchlistModal" class="modal hidden">
        <div class="modal-content glass-panel" style="width:350px;">
            <h2 style="margin:0; font-size:1.2rem;">New Watchlist</h2>
            <input type="text" id="newWatchlistName" placeholder="Name (e.g. Tech)..." style="width:100%; margin-top:15px; padding:10px;">
            <div class="modal-actions" style="margin-top:20px; display:flex; gap:10px;">
                <button id="cancelCreateWl" class="secondary-btn" style="flex:1;">Cancel</button>
                <button id="confirmCreateWl" class="primary-btn" style="flex:1;">Create</button>
            </div>
        </div>
    </div>

    <div id="addPortfolioModal" class="modal hidden">
        <div class="modal-content glass-panel" style="width:350px;">
            <h2 style="margin:0; font-size:1.2rem;">Add to Portfolio</h2>
            <div style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
                <input type="text" id="portTickerInput" readonly style="opacity:0.6;">
                <input type="number" id="portSharesInput" placeholder="Shares...">
                <input type="number" step="0.01" id="portBuyPriceInput" placeholder="Price (₹)...">
                <button id="savePortfolioBtn" class="primary-btn">Save Asset</button>
                <button id="closePortfolioBtn" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="/static/js/firebase-config.js"></script>
    
    <script src="/static/js/watchlist.js"></script>
</body>
</html>
